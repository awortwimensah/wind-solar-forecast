name: Hourly power forecast

on:
  schedule:
    - cron: "23 * * * *"        # every hour at :23 (UTC) - avoids the busy top of the hour
  workflow_dispatch:             # "Run workflow" button in the Actions tab

permissions:
  contents: write

concurrency:
  group: forecast
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: python backend/forecast.py
      - name: Commit new forecast
        run: |
          git config user.name  "forecast-bot"
          git config user.email "forecast-bot@users.noreply.github.com"
          git add docs/data/forecast.json
          git diff --cached --quiet || git commit -m "forecast $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
