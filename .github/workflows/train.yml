name: Retrain bias correction + ML

on:
  workflow_dispatch:             # run manually after uploading new measurements
  schedule:
    - cron: "41 3 1 * *"         # and once a month (1st, 03:41 UTC)

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Train (skips if no measurements file)
        run: |
          if [ -f data/measurements.csv ]; then
            python backend/train.py --measurements data/measurements.csv
          else
            echo "data/measurements.csv not found - nothing to train"; exit 0
          fi
      - name: Commit models
        run: |
          git config user.name  "forecast-bot"
          git config user.email "forecast-bot@users.noreply.github.com"
          git add models/ || true
          git diff --cached --quiet || git commit -m "retrain models $(date -u +%Y-%m-%d)"
          git push
